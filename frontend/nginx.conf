server {
    listen 80;
    server_name localhost;

    # Statik dosyaları sun (React uygulaması)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Sayfa yenilendiğinde 404 hatası almamak için index.html'e geri dön (React Router desteği)
        try_files $uri $uri/ /index.html;
    }

    # /api ile başlayan tüm istekleri arka plandaki Node.js (backend) sunucusuna yönlendir
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
